[build-system]
requires = ["setuptools>=61", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "isyntax2raw"
description = "iSyntax to raw format converter"
readme = "README.md"
license = "BSD-3-Clause"
authors = [
    {name = "Glencoe Software, Inc.", email="info@glencoesoftware.com"},
]
requires-python = ">=3.9"
dependencies = [
    'click==7.0',
    'pillow>=7.1.0',
    'numpy==1.17.3',
    'kajiki==0.8.2',
    'fsspec>=0.9.0',
    'python-dateutil>=2.8.2',
    'zarr>=2.18.0, <3.0.0'
]

[project.scripts]
isyntax2raw = "isyntax2raw.cli.isyntax2raw:main"

[project.urls]
Homepage = "https://github.com/glencoesoftware/isyntax2raw"

[tool.setuptools_scm]